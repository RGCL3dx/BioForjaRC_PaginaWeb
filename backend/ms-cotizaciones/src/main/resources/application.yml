# =====================================================================
#  ms-cotizaciones - BioForjaRC (EP-04)
#  Base de datos propia: bioforja_cotizaciones
#  Las credenciales se leen SIEMPRE desde variables de entorno.
# =====================================================================
server:
  port: 8095

spring:
  application:
    name: ms-cotizaciones

  datasource:
    url: jdbc:postgresql://${BIOFORJA_DB_HOST:localhost}:${BIOFORJA_DB_PORT:5432}/${BIOFORJA_COTIZACIONES_DB_NAME:bioforja_cotizaciones}
    username: ${BIOFORJA_DB_USERNAME:bioforja}
    password: ${BIOFORJA_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: America/Santiago
        format_sql: false

  jackson:
    time-zone: America/Santiago
    default-property-inclusion: non_null

  # HU-04.1: archivos .STL/.OBJ de hasta 50 MB. Se admite mas de un archivo
  # por solicitud (el formulario puede adjuntar varias piezas).
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 250MB
      file-size-threshold: 2MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

bioforja:
  jwt:
    secret: ${BIOFORJA_JWT_SECRET:}
    emisor: ${BIOFORJA_JWT_EMISOR:bioforjarc-ms-usuarios}
  # Los archivos 3D se guardan fuera del repositorio para no versionarlos.
  archivos:
    directorio: ${BIOFORJA_ARCHIVOS_DIRECTORIO:${user.home}/.bioforjarc/cotizaciones-archivos}
    max-archivos: ${BIOFORJA_ARCHIVOS_MAX:5}
    tamano-maximo-bytes: ${BIOFORJA_ARCHIVOS_TAMANO_MAX:52428800}
  correo:
    # En local no hay servidor SMTP: el enlace de pago se escribe en el log.
    remitente: ${BIOFORJA_CORREO_REMITENTE:no-reply@bioforjarc.cl}
  pago:
    # Enlace directo de pago que se envia al cliente al presupuestar.
    url-base: ${BIOFORJA_PAGO_URL_BASE:http://localhost:5173/pago-cotizacion}

logging:
  level:
    cl.bioforjarc.cotizaciones: INFO
    org.springframework.security: WARN
