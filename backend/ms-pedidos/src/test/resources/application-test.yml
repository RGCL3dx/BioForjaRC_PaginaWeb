# Perfil exclusivo para pruebas automatizadas.
# Usa la base bioforja_pedidos_test.
server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://${BIOFORJA_DB_HOST:localhost}:${BIOFORJA_DB_PORT:5432}/${BIOFORJA_PEDIDOS_TEST_DB_NAME:bioforja_pedidos_test}
    username: ${BIOFORJA_DB_USERNAME:bioforja}
    password: ${BIOFORJA_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop

bioforja:
  jwt:
    secret: clave-de-prueba-bioforjarc-1234567890
    emisor: bioforjarc-ms-usuarios
  clientes:
    usuarios-url: http://localhost:8091
    catalogo-url: http://localhost:8092
    envios-url: http://localhost:8093

logging:
  level:
    cl.bioforjarc.pedidos: WARN
    org.springframework: WARN
