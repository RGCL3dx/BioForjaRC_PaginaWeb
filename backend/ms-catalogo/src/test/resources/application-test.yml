# Perfil exclusivo para pruebas automatizadas.
# Usa la base bioforja_catalogo_test y un secreto JWT de prueba (no productivo).
server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://${BIOFORJA_DB_HOST:localhost}:${BIOFORJA_DB_PORT:5432}/${BIOFORJA_CATALOGO_TEST_DB_NAME:bioforja_catalogo_test}
    username: ${BIOFORJA_DB_USERNAME:bioforja}
    password: ${BIOFORJA_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop

bioforja:
  jwt:
    secret: secreto-de-pruebas-ms-usuarios-bioforjarc-2026-no-usar-en-produccion
  semilla:
    habilitada: true

logging:
  level:
    cl.bioforjarc.catalogo: WARN
    org.springframework: WARN
