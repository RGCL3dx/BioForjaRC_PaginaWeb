# =====================================================================
#  ms-consultas - BioForjaRC (EP-05)
#  Base de datos propia: bioforja_consultas
#  Las credenciales se leen SIEMPRE desde variables de entorno.
# =====================================================================
server:
  port: 8096

spring:
  application:
    name: ms-consultas

  datasource:
    url: jdbc:postgresql://${BIOFORJA_DB_HOST:localhost}:${BIOFORJA_DB_PORT:5432}/${BIOFORJA_CONSULTAS_DB_NAME:bioforja_consultas}
    username: ${BIOFORJA_DB_USERNAME:bioforja}
    password: ${BIOFORJA_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: America/Santiago
        format_sql: false

  jackson:
    time-zone: America/Santiago
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

bioforja:
  correo:
    # En local no hay servidor SMTP: el aviso se escribe en el log.
    remitente: ${BIOFORJA_CORREO_REMITENTE:no-reply@bioforjarc.cl}
    admin: ${BIOFORJA_CORREO_ADMIN:admin@bioforjarc.cl}

logging:
  level:
    cl.bioforjarc.consultas: INFO
