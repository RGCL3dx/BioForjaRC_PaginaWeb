# Perfil exclusivo para pruebas automatizadas.
# Usa la base bioforja_consultas_test.
server:
  port: 0

spring:
  datasource:
    url: jdbc:mysql://${BIOFORJA_DB_HOST:localhost}:${BIOFORJA_DB_PORT:3306}/${BIOFORJA_CONSULTAS_TEST_DB_NAME:bioforja_consultas_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
    username: ${BIOFORJA_DB_USERNAME:root}
    password: ${BIOFORJA_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop

bioforja:
  correo:
    remitente: no-reply@bioforjarc.cl
    admin: admin@bioforjarc.cl

logging:
  level:
    cl.bioforjarc.consultas: WARN
    org.springframework: WARN
