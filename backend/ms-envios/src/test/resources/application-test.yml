# Perfil exclusivo para pruebas automatizadas.
# Usa la base bioforja_envios_test.
server:
  port: 0

spring:
  datasource:
    url: jdbc:mysql://${BIOFORJA_DB_HOST:localhost}:${BIOFORJA_DB_PORT:3306}/${BIOFORJA_ENVIOS_TEST_DB_NAME:bioforja_envios_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
    username: ${BIOFORJA_DB_USERNAME:root}
    password: ${BIOFORJA_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop

bioforja:
  semilla:
    habilitada: true

logging:
  level:
    cl.bioforjarc.envios: WARN
    org.springframework: WARN
