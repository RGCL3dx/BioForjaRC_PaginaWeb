# Perfil exclusivo para pruebas automatizadas.
# Usa la base bioforja_usuarios_test y un secreto JWT de prueba (no productivo).
server:
  port: 0

spring:
  datasource:
    url: jdbc:mysql://${BIOFORJA_DB_HOST:localhost}:${BIOFORJA_DB_PORT:3306}/${BIOFORJA_DB_TEST_NAME:bioforja_usuarios_test}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Santiago&characterEncoding=UTF-8
    username: ${BIOFORJA_DB_USERNAME:root}
    password: ${BIOFORJA_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: create-drop

bioforja:
  jwt:
    secret: secreto-de-pruebas-ms-usuarios-bioforjarc-2026-no-usar-en-produccion
    expiracion-segundos: 3600
  semilla:
    habilitada: true
    admin-clave: Admin123
    cliente-clave: Clave1234

logging:
  level:
    cl.bioforjarc.usuarios: WARN
    org.springframework: WARN
