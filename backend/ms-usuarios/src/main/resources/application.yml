# =====================================================================
#  ms-usuarios - BioForjaRC (EP-02)
#  Base de datos propia: bioforja_usuarios
#  Las credenciales se leen SIEMPRE desde variables de entorno.
# =====================================================================
server:
  port: 8091

spring:
  application:
    name: ms-usuarios

  datasource:
    url: jdbc:postgresql://${BIOFORJA_DB_HOST:localhost}:${BIOFORJA_DB_PORT:5432}/${BIOFORJA_DB_NAME:bioforja_usuarios}
    username: ${BIOFORJA_DB_USERNAME:bioforja}
    password: ${BIOFORJA_DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          time_zone: America/Santiago
        format_sql: false

  jackson:
    time-zone: America/Santiago
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

bioforja:
  jwt:
    # Secreto de firma HMAC de al menos 32 caracteres. Sin valor por defecto:
    # el servicio falla al iniciar si no está configurado.
    secret: ${BIOFORJA_JWT_SECRET:}
    expiracion-segundos: ${BIOFORJA_JWT_EXPIRACION_SEGUNDOS:86400}
    emisor: bioforjarc-ms-usuarios
  semilla:
    habilitada: ${BIOFORJA_SEMILLA_HABILITADA:true}
    # Las cuentas semilla solo se crean si se define la clave en el entorno.
    admin-clave: ${BIOFORJA_SEMILLA_ADMIN_CLAVE:}
    cliente-clave: ${BIOFORJA_SEMILLA_CLIENTE_CLAVE:}
  correo:
    # En local no hay servidor SMTP: el enlace de confirmación se escribe
    # en el log. El envío real se conectará en la fase de integración.
    remitente: ${BIOFORJA_CORREO_REMITENTE:no-reply@bioforjarc.cl}
    url-base: ${BIOFORJA_URL_BASE:http://localhost:8090}

logging:
  level:
    cl.bioforjarc.usuarios: INFO
    org.springframework.security: WARN
